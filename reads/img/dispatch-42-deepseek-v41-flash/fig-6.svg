<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 404" width="960" height="404" role="img" aria-label="五代 DeepSeek 模型每 token 的 KV cache 字节数,对数轴条形图"><title>五代 DeepSeek 模型每 token 的 KV cache 字节数,对数轴条形图</title><rect width="960" height="404" fill="#fcfcfb"/><line x1="313.54594989585144" y1="80" x2="313.54594989585144" y2="306" stroke="#e3e3df" stroke-width="1"/><text x="313.54594989585144" y="324" font-size="11.5" fill="#6b6b66" text-anchor="middle" font-weight="400" font-family="system-ui,sans-serif">1 KB</text><line x1="524.641026171185" y1="80" x2="524.641026171185" y2="306" stroke="#e3e3df" stroke-width="1"/><text x="524.641026171185" y="324" font-size="11.5" fill="#6b6b66" text-anchor="middle" font-weight="400" font-family="system-ui,sans-serif">10 KB</text><line x1="735.7361024465185" y1="80" x2="735.7361024465185" y2="306" stroke="#e3e3df" stroke-width="1"/><text x="735.7361024465185" y="324" font-size="11.5" fill="#6b6b66" text-anchor="middle" font-weight="400" font-family="system-ui,sans-serif">100 KB</text><text x="236" y="100" font-size="13" fill="#1a1a19" text-anchor="end" font-weight="500" font-family="system-ui,sans-serif">DeepSeek-V1 (LLM 67B, BF16)</text><rect x="250" y="87" width="610.2998351300449" height="18" rx="4" fill="#2a78d6"/><text x="870.2998351300449" y="100" font-size="12.5" fill="#1a1a19" text-anchor="start" font-weight="600" font-family="system-ui,sans-serif">389,120 B</text><text x="250" y="119" font-size="10.5" fill="#6b6b66" text-anchor="start" font-weight="400" font-family="system-ui,sans-serif">95 层 × GQA-8 × 128 × 2 × BF16,全层 KV,本站重建</text><text x="236" y="146" font-size="13" fill="#1a1a19" text-anchor="end" font-weight="500" font-family="system-ui,sans-serif">V2 / V3 (MLA, BF16)</text><rect x="250" y="133" width="453.03706138812936" height="18" rx="4" fill="#2a78d6"/><text x="713.0370613881294" y="146" font-size="12.5" fill="#1a1a19" text-anchor="start" font-weight="600" font-family="system-ui,sans-serif">70,000 B</text><text x="250" y="165" font-size="10.5" fill="#6b6b66" text-anchor="start" font-weight="400" font-family="system-ui,sans-serif">576 × 2 字节 × 60 至 61 层 ≈ 69 至 70 KB,本站重建</text><text x="236" y="192" font-size="13" fill="#1a1a19" text-anchor="end" font-weight="500" font-family="system-ui,sans-serif">V3.2 (DSA, FP8 稀疏解码)</text><rect x="250" y="179" width="401.7695896013622" height="18" rx="4" fill="#2a78d6"/><text x="661.7695896013622" y="192" font-size="12.5" fill="#1a1a19" text-anchor="start" font-weight="600" font-family="system-ui,sans-serif">40,016 B</text><text x="250" y="211" font-size="10.5" fill="#6b6b66" text-anchor="start" font-weight="400" font-family="system-ui,sans-serif">656 字节 × 61 层,FlashMLA 口径</text><text x="236" y="238" font-size="13" fill="#1a1a19" text-anchor="end" font-weight="500" font-family="system-ui,sans-serif">V4-Flash (CSA + HCA, FP8)</text><rect x="250" y="225" width="178.76201345459992" height="18" rx="4" fill="#2a78d6"/><text x="438.7620134545999" y="238" font-size="12.5" fill="#1a1a19" text-anchor="start" font-weight="600" font-family="system-ui,sans-serif">3,514 B</text><text x="250" y="257" font-size="10.5" fill="#6b6b66" text-anchor="start" font-weight="400" font-family="system-ui,sans-serif">全局 KV,SGLang 团队表;本站复核 3,514.25</text><text x="236" y="284" font-size="13" fill="#1a1a19" text-anchor="end" font-weight="600" font-family="system-ui,sans-serif">V4.1-Flash (CED + CSA2, FP4)</text><rect x="250" y="271" width="52.86242948826521" height="18" rx="4" fill="#eb6834"/><text x="312.8624294882652" y="284" font-size="12.5" fill="#1a1a19" text-anchor="start" font-weight="600" font-family="system-ui,sans-serif">890 B</text><text x="250" y="303" font-size="10.5" fill="#6b6b66" text-anchor="start" font-weight="400" font-family="system-ui,sans-serif">全局 KV,技术报告;本站复核 534 + 356</text><text x="24" y="34" font-size="16" fill="#1a1a19" text-anchor="start" font-weight="600" font-family="system-ui,sans-serif">五代 DeepSeek 模型的每 token KV 字节数(对数轴)</text><text x="24" y="55" font-size="11.5" fill="#6b6b66" text-anchor="start" font-weight="400" font-family="system-ui,sans-serif">V1 至 V3.2 为全层 KV(本站按公开维度重建);V4-Flash 与 V4.1-Flash 为不随长度增长的“全局 KV”口径,不含有界的 SWA KV。两种口径只可比量级。</text><text x="24" y="382" font-size="10.5" fill="#6b6b66" text-anchor="start" font-weight="400" font-family="system-ui,sans-serif">来源:FlashMLA README 字节布局、SGLang 内存池断言、技术报告图 1(b) 与 §6、DeepSeek-LLM / V2 公开配置。437 = 389,120 / 890;3.95 = 3,514 / 890。</text></svg>