<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc"><title id="title">昇腾 RL infra 的 DSec 式内置 Harness 部署</title><desc id="desc">Sandbox Platform 的 CPU 资源域内同时运行 Worker Container Pool 和 Agent Sandbox Pool。Harness 与工具位于各 Agent Sandbox 内。GPU 或昇腾 NPU 作业提供模型生成与学习计算，执行状态独立保留。池化命名与端点接线为集成建议。</desc><defs><marker id="line-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#91a0ae"/></marker><marker id="red-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#bb625a"/></marker><marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#527da9"/></marker><marker id="green-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#658953"/></marker></defs><rect width="1600" height="1020" fill="white"/><g font-family="Inter, Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="40" y="45" text-anchor="start" fill="#283644" font-size="31" font-weight="500">昇腾 RL infra · DSec 式部署</text><text x="1560" y="43" text-anchor="end" fill="#627184" font-size="21" font-weight="400">方案 B · Harness 内置</text><polyline points="75,86 122,86" fill="none" stroke="white" stroke-width="7" stroke-linejoin="round"/><polyline points="75,86 122,86" fill="none" stroke="#bb625a" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#red-arrow)"/><text x="137" y="93" text-anchor="start" fill="#283644" font-size="20" font-weight="400">管理 / 生命周期</text><polyline points="440,86 487,86" fill="none" stroke="white" stroke-width="7" stroke-linejoin="round"/><polyline points="440,86 487,86" fill="none" stroke="#527da9" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#blue-arrow)"/><text x="502" y="93" text-anchor="start" fill="