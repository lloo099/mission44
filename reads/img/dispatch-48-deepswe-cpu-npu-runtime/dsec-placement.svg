 NPU 作业</text><rect x="1160" y="245" width="380" height="160" rx="9" fill="#f8eae8" stroke="#c88580" stroke-width="2"/><text x="1350" y="287" text-anchor="middle" fill="#283644" font-size="25" font-weight="500">Learner / Training Engine</text><text x="1350" y="332" text-anchor="middle" fill="#283644" font-size="23" font-weight="400">参数 / 梯度 / 优化器</text><text x="1350" y="373" text-anchor="middle" fill="#627184" font-size="20" font-weight="400">训练状态按 checkpoint 恢复</text><rect x="1160" y="565" width="380" height="260" rx="9" fill="#eaf0f9" stroke="#7d9fc8" stroke-width="2"/><text x="1350" y="607" text-anchor="middle" fill="#283644" font-size="24" font-weight="500">Rollout / Inference Engine</text><text x="1350" y="660" text-anchor="middle" fill="#283644" font-size="26" font-weight="400">Prefill / Decode</text><rect x="1180" y="700" width="340" height="90" rx="6" fill="white" stroke="#7d9fc8" stroke-width="2"/><text x="1350" y="735" text-anchor="middle" fill="#283644" font-size="25" font-weight="400">Context / KV Cache</text><text x="1350" y="770" text-anchor="middle" fill="#283644" font-size="20" font-weight="400">Token / Logprob / Policy ID</text><text x="1350" y="875" text-anchor="middle" fill="#627184" font-size="21" font-weight="400">同卡或分卡按项目部署</text><text x="1350" y="910" text-anchor="middle" fill="#627184" font-size="19" font-weight="400">共卡切换属于本项目集成协议</text><polyline points="215,278 215,325 22,325 22,555 65,555" fill="none" stroke="white" stroke-width="7" stroke-linejoin="round"/><polyline points="215,278 215,325 22,325 22,555 65,555" fill="none" stroke="#91a0ae" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#line-arrow)"/><rect x="79.4" y="304" width="131.2" height="25" fill="white"/><text x="145" y="322" text-anchor="middle" fill="#627184" font-size="20" font-weight="400">Dispatch</text><polyline points="65,690 10,690 10,310 890,310 890,278" fill="none" stroke="white" stroke-width="7" stroke-linejoin="round"/><polyline points="65,690 10,690 10,310